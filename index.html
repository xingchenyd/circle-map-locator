<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圆范围定位工具 | 单圆范围 / 两圆交点</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; display: flex; overflow: hidden; }
    #panel { width: 340px; flex: none; height: 100vh; box-sizing: border-box; padding: 14px;
             overflow-y: auto; background: #f7f8fa; border-right: 1px solid #e2e5ea; font-size: 13px; color: #222; }
    #map { flex: 1; height: 100vh; }
    h2 { font-size: 15px; margin: 4px 0 10px; }
    .card { background: #fff; border: 1px solid #e2e5ea; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .card h3 { font-size: 13px; margin: 0 0 8px; color: #1a56db; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .row label { flex: none; width: 40px; color: #555; }
    .row input, .row select { flex: 1; min-width: 0; box-sizing: border-box; height: 26px; padding: 0 6px;
             border: 1px solid #ccd2da; border-radius: 4px; font-size: 12px; background: #fff; }
    button { border: 1px solid #ccd2da; background: #fff; border-radius: 4px; padding: 5px 8px;
             font-size: 12px; cursor: pointer; }
    button.active { background: #1a56db; color: #fff; border-color: #1a56db; }
    button.primary { background: #1a56db; color: #fff; border-color: #1a56db; }
    button.mini { padding: 2px 6px; font-size: 11px; }
    .btnrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
    .result { background: #f0f6ff; border: 1px solid #bcd3f5; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 13px; }
    .coord { font-family: Consolas, monospace; font-size: 12px; background: #fff; border: 1px solid #d5e2f7;
             border-radius: 4px; padding: 4px 6px; margin: 4px 0; word-break: break-all; cursor: pointer; }
    .coord:hover { border-color: #1a56db; }
    .pt-item { border: 1px solid #e2e5ea; border-radius: 6px; padding: 6px 8px; margin: 6px 0; background: #fff; }
    .pt-name { font-weight: bold; font-size: 12.5px; }
    .pt-coord { font-family: Consolas, monospace; font-size: 11.5px; color: #1a56db; cursor: pointer; word-break: break-all; }
    .pt-dist { font-size: 11.5px; color: #1e8e3e; margin: 2px 0; }
    .pt-ops { margin-top: 4px; display: flex; gap: 4px; }
    .muted { color: #777; font-size: 12px; line-height: 1.6; }
    .warn { color: #c0392b; font-size: 12px; }
    .ok { color: #1e8e3e; font-size: 12px; }
    #statusLine { min-height: 16px; }
    .hidden { display: none !important; }
</style>
</head>
<body>
<div id="panel">
    <h2>🎯 圆范围定位工具</h2>

    <div class="card">
        <h3>📍 快速定位城市</h3>
        <div class="row"><label>省份</label><select id="provSel"></select></div>
        <div class="row"><label>城市</label><select id="citySel"></select></div>
        <div class="muted">选择后地图自动跳转到该城市中心</div>
    </div>

    <div class="card">
        <h3>⚙️ 模式</h3>
        <div class="btnrow">
            <button id="mode1">单圆 · 范围圈</button>
            <button id="mode2">两圆 · 交点</button>
        </div>
        <div class="muted" id="modeHint"></div>
    </div>

    <div class="card">
        <h3 style="color:#1a56db">⭕ 圆 A</h3>
        <div class="row"><label>经度</label><input id="lngA" type="number" step="0.0001"></div>
        <div class="row"><label>纬度</label><input id="latA" type="number" step="0.0001"></div>
        <div class="row"><label>半径</label><input id="rA" type="number" step="0.01"> <span>km</span></div>
        <button id="btnPickA">🖱 地图点选圆心 A</button>
    </div>

    <div class="card" id="cardB">
        <h3 style="color:#e67e22">⭕ 圆 B</h3>
        <div class="row"><label>经度</label><input id="lngB" type="number" step="0.0001"></div>
        <div class="row"><label>纬度</label><input id="latB" type="number" step="0.0001"></div>
        <div class="row"><label>半径</label><input id="rB" type="number" step="0.01"> <span>km</span></div>
        <button id="btnPickB">🖱 地图点选圆心 B</button>
    </div>

    <div class="result" id="resultBox">
        <b id="resultTitle">计算结果</b>
        <div id="resultList"></div>
        <div id="distLine" class="muted"></div>
    </div>

    <div class="card">
        <h3>📌 选点记录</h3>
        <div class="muted">点击地图任意位置即可记录一个点（自动命名：选点1、选点2…），记录保存在浏览器本地。</div>
        <div class="btnrow" style="margin-top:6px">
            <button id="btnGeo" class="primary">📍 添加自身位置（自动定位）</button>
        </div>
        <div class="btnrow" style="margin-top:6px">
            <label><input type="checkbox" id="chkLines" checked> 显示连线</label>
            <button id="btnFit" class="primary">缩放至全部</button>
            <button id="btnClearPts">清空记录</button>
        </div>
        <div id="statusLine" class="muted"></div>
        <div id="ptList"></div>
    </div>

    <p class="muted">坐标采用 GCJ-02（高德底图坐标系）；两圆交点为局部投影下的精确解，通常 2 个，请结合实际参照物判断。城市中心坐标仅用于快速跳转视野。「添加自身位置」使用浏览器定位（WGS-84，已自动转换为 GCJ-02），精度取决于设备 GPS 与网络环境。</p>
</div>

    try {
        localStorage.setItem('cml_state_v1', JSON.stringify(state));
        localStorage.setItem('cml_points_v1', JSON.stringify({ points, nextIdx }));
    } catch (e) {}
}
function restore() {
    try {
        const s = JSON.parse(localStorage.getItem('cml_state_v1'));
        if (s && s.A && s.B) state = Object.assign({}, DEFAULT_STATE, s);
        const p = JSON.parse(localStorage.getItem('cml_points_v1'));
        if (p && Array.isArray(p.points)) { points = p.points; nextIdx = p.nextIdx || points.length + 1; }
    } catch (e) {}
}

/* ================= 工具函数 ================= */
function copyText(t) {
    try { navigator.clipboard.writeText(t); flash('已复制 ' + t); }
    catch (e) {
        const ta = document.createElement('textarea');
        ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); flash('已复制 ' + t); } catch (e2) { flash('复制失败，请手动选择'); }
        document.body.removeChild(ta);
    }
}
function flash(msg) { document.getElementById('statusLine').innerHTML = '<span class="ok">' + msg + '</span>'; }
function fmt(v) { return Number(v).toFixed(6); }

// Haversine 直线距离（km）
function distKm(lng1, lat1, lng2, lat2) {
    const R = 6371.0088, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
}

// WGS-84（浏览器 GPS 定位）→ GCJ-02（高德底图），避免定位点在地图上偏移数百米
function wgs2gcj(lng, lat) {
    if (lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271) return [lng, lat]; // 境外不偏移
    const a = 6378245.0, ee = 0.00669342162296594323;
    const tl = function (x, y) {
        let r = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        r += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        r += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        r += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320.0 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return r;
    };
    const tg = function (x, y) {
        let r = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        r += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        r += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        r += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return r;
    };
    let dLat = tg(lng - 105.0, lat - 35.0);
    let dLng = tl(lng - 105.0, lat - 35.0);
    const radLat = lat / 180.0 * Math.PI;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
    dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
    return [lng + dLng, lat + dLat];
}

// 局部等距圆柱投影下两圆交点（此尺度误差 < 1m）
function intersect(A, B) {
    const rA = A.r * 1000, rB = B.r * 1000;
    const lat0 = (A.lat + B.lat) / 2, lng0 = (A.lng + B.lng) / 2;
    const rad = lat0 * Math.PI / 180;
    const mLat = 111132.954 - 559.822 * Math.cos(2 * rad) + 1.175 * Math.cos(4 * rad);
    const mLng = 111412.84 * Math.cos(rad) - 93.5 * Math.cos(3 * rad) + 0.118 * Math.cos(5 * rad);
    const ax = (A.lng - lng0) * mLng, ay = (A.lat - lat0) * mLat;
    const bx = (B.lng - lng0) * mLng, by = (B.lat - lat0) * mLat;
    const d = Math.hypot(bx - ax, by - ay);
    if (d === 0 || d > rA + rB || d < Math.abs(rA - rB)) return { ok: false, d };
    const a = (d * d + rA * rA - rB * rB) / (2 * d);
    const h = Math.sqrt(Math.max(0, rA * rA - a * a));
    const ux = (bx - ax) / d, uy = (by - ay) / d;
    const px = ax + a * ux, py = ay + a * uy;
    const pts = [];
    if (h < 0.5) { pts.push({ lng: lng0 + px / mLng, lat: lat0 + py / mLat }); return { ok: true, d, tangent: true, pts }; }
    pts.push({ lng: lng0 + (px - h * uy) / mLng, lat: lat0 + (py + h * ux) / mLat });
    pts.push({ lng: lng0 + (px + h * uy) / mLng, lat: lat0 + (py - h * ux) / mLat });
    return { ok: true, d, pts };
}

/* ================= 渲染 ================= */
function readInputs() {
    state.A = { lng: +document.getElementById('lngA').value || 0, lat: +document.getElementById('latA').value || 0, r: +document.getElementById('rA').value || 0 };
    state.B = { lng: +document.getElementById('lngB').value || 0, lat: +document.getElementById('latB').value || 0, r: +document.getElementById('rB').value || 0 };
}

function render(keepView) {
    drawLayer.clearLayers();
    const two = state.mode === 2;

    // 圆 A（单双圆模式都画）
    L.circle([state.A.lat, state.A.lng], { radius: state.A.r * 1000, color: '#1a56db', weight: 2, fillColor: '#1a56db', fillOpacity: 0.08 }).addTo(drawLayer);
    L.circleMarker([state.A.lat, state.A.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#1a56db', fillOpacity: 1 })
        .bindTooltip('圆心 A', { permanent: true, direction: 'right', offset: [8, 0] }).addTo(drawLayer);

    const listEl = document.getElementById('resultList');
    const distEl = document.getElementById('distLine');
    document.getElementById('cardB').classList.toggle('hidden', !two);
    document.getElementById('modeHint').textContent = two ? '两圆均显示，重叠区边缘的红点为交点' : '仅显示圆 A 的范围圈，切换到"两圆"可计算交点';
    document.getElementById('mode1').classList.toggle('active', !two);
    document.getElementById('mode2').classList.toggle('active', two);
    document.getElementById('resultTitle').textContent = two ? '交点计算结果' : '单圆模式';

    if (two) {
        L.circle([state.B.lat, state.B.lng], { radius: state.B.r * 1000, color: '#e67e22', weight: 2, fillColor: '#e67e22', fillOpacity: 0.08 }).addTo(drawLayer);
        L.circleMarker([state.B.lat, state.B.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#e67e22', fillOpacity: 1 })
            .bindTooltip('圆心 B', { permanent: true, direction: 'right', offset: [8, 0] }).addTo(drawLayer);

        const r = intersect(state.A, state.B);
        listEl.innerHTML = '';
        if (!r.ok) {
            listEl.innerHTML = '<span class="warn">两圆无交点：圆心距 ' + (r.d / 1000).toFixed(2) + ' km，半径和 ' +
                (state.A.r + state.B.r).toFixed(2) + ' km，半径差 ' + Math.abs(state.A.r - state.B.r).toFixed(2) + ' km。</span>';
            distEl.textContent = '';
        } else {
            r.pts.forEach(function (p, i) {
                const name = r.tangent ? '交点（相切）' : '交点 ' + '①②'[i];
                const text = fmt(p.lng) + ', ' + fmt(p.lat);
                const div = document.createElement('div');
                div.className = 'coord'; div.title = '点击复制';
                div.textContent = name + '：' + text;
                div.onclick = function () { copyText(text); };
                listEl.appendChild(div);
                L.circleMarker([p.lat, p.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#c0392b', fillOpacity: 1 })
                    .bindPopup(name + '<br>' + text + '<br>距 A ' + state.A.r + ' km，距 B ' + state.B.r + ' km').addTo(drawLayer);
            });
            distEl.textContent = '圆心距 ' + (r.d / 1000).toFixed(3) + ' km · 共 ' + r.pts.length + ' 个交点';
        }
    } else {
        listEl.innerHTML = '<span class="muted">仅显示范围圈（圆 A，' + state.A.r + ' km）。需要交点请切换"两圆 · 交点"模式。</span>';
        distEl.textContent = '';
    }

    // 选点记录 + 连线 + 距离
    const ptListEl = document.getElementById('ptList');
    ptListEl.innerHTML = '';
    if (document.getElementById('chkLines').checked && points.length >= 2) {
        const latlngs = points.map(function (p) { return [p.lat, p.lng]; });
        L.polyline(latlngs, { color: '#1e8e3e', weight: 2, dashArray: '6 6' }).addTo(drawLayer);
    }
    points.forEach(function (p, i) {
        const text = fmt(p.lng) + ', ' + fmt(p.lat);
        L.circleMarker([p.lat, p.lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#7f8c8d', fillOpacity: 1 })
            .bindPopup('<b>' + p.name + '</b><br>' + text).addTo(drawLayer);

        const item = document.createElement('div');
        item.className = 'pt-item';
        let html = '<div class="pt-name">' + p.name + '</div><div class="pt-coord">' + text + '</div>';
        if (i > 0) {
            const prev = points[i - 1];
            const dk = distKm(prev.lng, prev.lat, p.lng, p.lat);
            html += '<div class="pt-dist">↔ 距' + prev.name + '：' + dk.toFixed(3) + ' km（直线）</div>';
        }
        item.innerHTML = html;
        item.querySelector('.pt-coord').onclick = function () { copyText(text); };
        const ops = document.createElement('div');
        ops.className = 'pt-ops';
        const bLoc = document.createElement('button'); bLoc.className = 'mini'; bLoc.textContent = '📍定位';
        bLoc.onclick = function () { map.setView([p.lat, p.lng], Math.max(map.getZoom(), 13)); };
        const bRen = document.createElement('button'); bRen.className = 'mini'; bRen.textContent = '✎改名';
        bRen.onclick = function () { const n = prompt('修改名称：', p.name); if (n) { p.name = n; persist(); render(); } };
        const bDel = document.createElement('button'); bDel.className = 'mini'; bDel.textContent = '🗑删除';
        bDel.onclick = function () { points.splice(i, 1); persist(); render(); };
        ops.appendChild(bLoc); ops.appendChild(bRen); ops.appendChild(bDel);
        item.appendChild(ops);
        ptListEl.appendChild(item);
    });

    persist();
    if (!keepView) fitAll();
}

function fitAll() {
    const lats = [state.A.lat], lngs = [state.A.lng];
    lats.push(state.A.lat + state.A.r / 111.32, state.A.lat - state.A.r / 111.32);
    const dLngA = state.A.r / (111.32 * Math.cos(state.A.lat * Math.PI / 180));
    lngs.push(state.A.lng + dLngA, state.A.lng - dLngA);
    if (state.mode === 2) {
        lats.push(state.B.lat + state.B.r / 111.32, state.B.lat - state.B.r / 111.32);
        const dLngB = state.B.r / (111.32 * Math.cos(state.B.lat * Math.PI / 180));
        lngs.push(state.B.lng + dLngB, state.B.lng - dLngB);
    }
    points.forEach(function (p) { lats.push(p.lat); lngs.push(p.lng); });
    map.fitBounds([[Math.min.apply(null, lats), Math.min.apply(null, lngs)], [Math.max.apply(null, lats), Math.max.apply(null, lngs)]], { padding: [20, 20] });
}

/* ================= 交互 ================= */
function syncInputs() {
    document.getElementById('lngA').value = state.A.lng; document.getElementById('latA').value = state.A.lat; document.getElementById('rA').value = state.A.r;
    document.getElementById('lngB').value = state.B.lng; document.getElementById('latB').value = state.B.lat; document.getElementById('rB').value = state.B.r;
}

['lngA', 'latA', 'rA', 'lngB', 'latB', 'rB'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () { readInputs(); render(true); });
});

function setPick(t) {
    pickTarget = (pickTarget === t) ? null : t;
    document.getElementById('btnPickA').classList.toggle('active', pickTarget === 'A');
    document.getElementById('btnPickB').classList.toggle('active', pickTarget === 'B');
    document.getElementById('statusLine').innerHTML = pickTarget ? '请在地图上点击，设置为圆心 ' + pickTarget : '';
}
document.getElementById('btnPickA').onclick = function () { setPick('A'); };
document.getElementById('btnPickB').onclick = function () { setPick('B'); };

function addPoint(lng, lat) {
    points.push({ id: nextIdx, name: '选点' + nextIdx, lng: lng, lat: lat });
    nextIdx += 1;
    flash('已记录 ' + points[points.length - 1].name);
}

map.on('click', function (e) {
    const lat = e.latlng.lat, lng = e.latlng.lng;
    if (pickTarget) {
        const t = pickTarget;
        state[t].lng = +fmt(lng); state[t].lat = +fmt(lat);
        syncInputs(); setPick(t); // toggle 关闭点选模式
        render(true);
        return;
    }
    addPoint(+fmt(lng), +fmt(lat));
    render(true);
});

document.getElementById('mode1').onclick = function () { state.mode = 1; render(); };
document.getElementById('mode2').onclick = function () { state.mode = 2; render(); };
document.getElementById('btnFit').onclick = function () { fitAll(); };
document.getElementById('btnClearPts').onclick = function () {
    if (points.length && confirm('确定清空全部 ' + points.length + ' 个选点记录？')) { points = []; persist(); render(true); }
};
document.getElementById('chkLines').onchange = function () { render(true); };

/* ================= 自身位置定位 ================= */
let geoCount = 0;
document.getElementById('btnGeo').onclick = function () {
    const st = document.getElementById('statusLine');
    if (!navigator.geolocation) { st.innerHTML = '<span class="warn">当前浏览器不支持定位功能</span>'; return; }
    st.innerHTML = '正在获取自身位置…（浏览器弹出授权时请选择"允许"）';
    navigator.geolocation.getCurrentPosition(function (pos) {
        const g = wgs2gcj(pos.coords.longitude, pos.coords.latitude);
        const lng = +fmt(g[0]), lat = +fmt(g[1]);
        geoCount += 1;
        points.push({ id: nextIdx, name: '我的位置' + (geoCount > 1 ? geoCount : ''), lng: lng, lat: lat });
        nextIdx += 1;
        render(true);
        map.setView([lat, lng], 15);
        flash('已记录我的位置（定位精度约 ' + Math.round(pos.coords.accuracy) + ' 米）');
    }, function (err) {
        const msg = { 1: '定位权限被拒绝：请在浏览器地址栏左侧的锁形图标中允许"位置"权限后重试', 2: '位置不可用：请检查设备 GPS 或网络', 3: '获取超时：请重试' }[err.code] || ('定位失败：' + err.message);
        st.innerHTML = '<span class="warn">' + msg + '</span>';
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
};

/* ================= 省市联动 ================= */
const provSel = document.getElementById('provSel');
const citySel = document.getElementById('citySel');
Object.keys(CITIES).forEach(function (p) {
    const o = document.createElement('option'); o.value = p; o.textContent = p; provSel.appendChild(o);
});
provSel.onchange = function () {
    citySel.innerHTML = '';
    Object.keys(CITIES[provSel.value]).forEach(function (c) {
        const o = document.createElement('option'); o.value = c; o.textContent = c; citySel.appendChild(o);
    });
    jumpCity();
};
citySel.onchange = jumpCity;
function jumpCity() {
    const c = CITIES[provSel.value] && CITIES[provSel.value][citySel.value];
    if (c) map.setView(c, 12);
}
// 默认定位到湖南·长沙
provSel.value = '湖南省';
provSel.onchange();

/* ================= 启动 ================= */
restore();
syncInputs();
render();
</script>
</body>
</html>
